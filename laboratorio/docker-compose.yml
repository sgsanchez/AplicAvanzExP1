# =====================================================================
#  TurnoConnect - Entorno de MongoDB con Docker Compose
#  Estudiante: SANTIAGO GEOVANNY SANCHEZ CAMACHO - NRC 37869
# =====================================================================
#  Uso:
#    docker compose up -d                 -> solo MongoDB
#    docker compose --profile ui up -d    -> MongoDB + Mongo Express (interfaz web)
#    docker compose --profile full up -d --build -> todo (Mongo + Mongo Express + App)
# =====================================================================

services:
  # ---------------------------------------------------------------
  # Base de datos compartida por los cuatro mecanismos de comunicación
  # ---------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: turnoconnect-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: turnoconnect
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - turnoconnect-net

  # ---------------------------------------------------------------
  # Mongo Express: interfaz web para VER los documentos almacenados
  # (útil para las capturas de "evidencia en MongoDB" del informe)
  # ---------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    container_name: turnoconnect-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_SITE_BASEURL: /
    networks:
      - turnoconnect-net
    profiles:
      - ui
      - full

  # ---------------------------------------------------------------
  # Aplicación Node.js (REST + WebSocket + TCP + UDP)
  # Solo se levanta con:  docker compose --profile full up -d --build
  # ---------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turnoconnect-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"   # REST + Socket.IO
      - "5000:5000"   # TCP
      - "5001:5001/udp" # UDP
    environment:
      PORT: "3000"
      TCP_PORT: "5000"
      UDP_PORT: "5001"
      MONGODB_URI: mongodb://mongo:27017/turnoconnect
      JWT_SECRET: cambiar_esta_clave_en_produccion_1234567890abcdef
      JWT_EXPIRES: 2h
      ESTUDIANTE_NOMBRE: SANTIAGO GEOVANNY SANCHEZ CAMACHO
      ESTUDIANTE_NRC: "37869"
    networks:
      - turnoconnect-net
    profiles:
      - full

volumes:
  mongo_data:
    driver: local

networks:
  turnoconnect-net:
    driver: bridge
